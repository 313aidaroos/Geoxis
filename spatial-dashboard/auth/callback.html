<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in...</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="min-h-screen bg-surface-0 text-slate-100 flex items-center justify-center">
  <div class="text-center">
    <div class="text-lg">Signing you in...</div>
  </div>
  <script type="module">
    import { consumeAuthHash, currentUser, setToken, safeNextPath } from "/src/authClient.js";

    const params = new URLSearchParams(location.search);
    const safe = safeNextPath(params.get("next"));
    try {
      const code = params.get("code");
      let user;
      if (code) {
        // Retain compatibility with existing PKCE links generated by the SDK.
        const cfg = await fetch("/api/config", { cache: "no-store" }).then(r => r.json());
        const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error || !data.session?.access_token) throw error || new Error("No session returned");
        setToken(data.session.access_token);
        user = data.user;
      } else {
        // The app uses its own token store; an unrelated SDK client has no session.
        if (!consumeAuthHash()) throw new Error("Missing sign-in token");
        user = await currentUser();
      }
      location.replace(user?.user_metadata?.has_password
        ? safe : `/set-password.html?next=${encodeURIComponent(safe)}`);
    } catch {
      location.replace(`/login.html?error=link_expired&next=${encodeURIComponent(safe)}`);
    }
  </script>
</body>
</html>
