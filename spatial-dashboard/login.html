<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geoxis Login</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-surface-0 text-slate-100 font-sans flex items-center justify-center p-6">
  <main class="w-full max-w-md rounded-2xl border border-line bg-surface-1 p-6 shadow-2xl">
    <a href="/" class="text-emerald-300 text-sm">← Geoxis globe</a>
    <h1 class="mt-4 text-2xl font-semibold">Sign in to Geoxis</h1>
    <p class="mt-2 text-sm text-slate-400">Enter your email. Supabase sends a magic link; no password needed.</p>
    <form id="loginForm" class="mt-6 space-y-3">
      <input id="email" type="email" autocomplete="email" required placeholder="you@company.com" class="w-full h-11 px-3 rounded-md bg-surface-2 border border-line text-slate-100" />
      <button class="w-full h-11 rounded-md bg-emerald-500 text-slate-950 font-medium">Send magic link</button>
    </form>
    <p id="status" class="mt-4 text-sm text-slate-400"></p>
    <div id="session" class="hidden mt-5 rounded-lg bg-surface-2 p-3 text-sm"></div>
  </main>
  <script type="module">
    import { consumeAuthHash, requestMagicLink, loadMe, clearSession } from "/src/authClient.js";
    const status = document.getElementById("status");
    const session = document.getElementById("session");
    async function refresh() {
      consumeAuthHash();
      const me = await loadMe().catch(() => null);
      if (me) {
        session.classList.remove("hidden");
        session.innerHTML = `Signed in as <b>${me.user.email}</b><br>Tenant: ${me.tenant.name}<br>Role: ${me.role}<br><button id="out" class="mt-3 text-red-300">Sign out</button>`;
        document.getElementById("out").onclick = () => { clearSession(); location.reload(); };
        status.textContent = "";
      }
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending magic link…";
      try {
        await requestMagicLink(document.getElementById("email").value);
        status.textContent = "Check your email for the Geoxis magic link.";
      } catch {
        status.textContent = "Login is not configured yet. Try again after deployment env is active.";
      }
    });
    refresh();
  </script>
</body>
</html>
